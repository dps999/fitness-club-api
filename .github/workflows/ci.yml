name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://fitness@127.0.0.1:5432/fitness_club_test
      TEST_DATABASE_URL: postgresql+asyncpg://fitness@127.0.0.1:5432/fitness_club_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fitness
          POSTGRES_DB: fitness_club_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U fitness -d fitness_club_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: python -m pip install ".[dev]"
      - name: Apply migrations
        run: alembic upgrade head
      - name: Run integration tests
        run: pytest -q
      - name: Run Ruff
        run: |
          ruff check .
          ruff format --check .
